name: IHES inspect report 2

on:
  pull_request:
    branches: [main]
    paths:
      - ihes-inspect-trigger.txt

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Build and commit public-data report
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ihes && mkdir -p /tmp/ihes/model /tmp/ihes/path
          curl -fL --retry 3 'https://www.kaggle.com/api/v1/datasets/download/arabidopsisthalian/model-ihes-1780290207-e40960' -o /tmp/ihes/model.zip
          curl -fL --retry 3 'https://www.kaggle.com/api/v1/datasets/download/arabidopsisthalian/ihes-path' -o /tmp/ihes/path.zip
          curl -fL --retry 3 'https://www.kaggle.com/api/v1/kernels/pull/trydotatwo/cayleypy-2xt4-ihes-example' -o /tmp/ihes/notebook.json
          unzip -q /tmp/ihes/model.zip -d /tmp/ihes/model
          unzip -q /tmp/ihes/path.zip -d /tmp/ihes/path
          python - <<'PY'
          import json, pathlib
          r=pathlib.Path('/tmp/ihes'); out=[]
          out.append('MODEL FILES')
          for p in sorted((r/'model').rglob('*')):
              if p.is_file(): out.append(f'{p.relative_to(r/"model")}\t{p.stat().st_size}')
          out.append('\nPATH FILES')
          for p in sorted((r/'path').rglob('*')):
              if p.is_file():
                  lines=p.read_text(errors='replace').splitlines()
                  out.append(f'{p.relative_to(r/"path")}\tbytes={p.stat().st_size}\tlines={len(lines)}')
                  out.append('FIRST='+repr(lines[:3]))
                  out.append('LAST='+repr(lines[-3:]))
          d=json.loads((r/'notebook.json').read_text())
          out.append('\nNOTEBOOK TOP KEYS='+repr(list(d)))
          def scan(x,q=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      qq=q+k
                      if k.lower() in ('source','script','code','kernelblob','blob','cells'):
                          s=v if isinstance(v,str) else json.dumps(v,ensure_ascii=False)
                          out.append(f'\nFIELD {qq} TYPE={type(v).__name__} LEN={len(s)}\n{s[:50000]}')
                      scan(v,qq+'.')
              elif isinstance(x,list):
                  for i,v in enumerate(x[:200]): scan(v,q+str(i)+'.')
          scan(d)
          for p in sorted((r/'model').glob('*.json')):
              out.append(f'\nMODELJSON {p.name}\n'+p.read_text(errors='replace')[:50000])
          pathlib.Path('ihes_inspection_report.txt').write_text('\n'.join(out))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ihes_inspection_report.txt
          git commit -m 'record IHES public-data inspection' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
